<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamForge — SSC CGL Quant PYQs</title>
  <meta name="description" content="Distraction-free SSC CGL Tier 1 Quantitative Aptitude previous-year questions, with basic and shortcut solutions." />

  <!-- KaTeX CDN (math rendering) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <!-- Fonts: Space Grotesk (display), Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="hero-accent-bar" aria-hidden="true"></span>
        <span class="sidebar__brand-text">ExamForge</span>
      </div>
      <p class="sidebar__eyebrow">SSC CGL · Tier 1 · Quant</p>

      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Main">
        <button type="button" class="nav-link" data-route="practice">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h5A1.5 1.5 0 0 1 10 3.5v9A1.5 1.5 0 0 1 8.5 14h-5A1.5 1.5 0 0 1 2 12.5v-9Z" stroke="currentColor" stroke-width="1.5"/><path d="M12 5.5 14 6.7v5.6L12 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Practice
        </button>
        <button type="button" class="nav-link" data-route="progress">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 14V2M2 14h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11V8M8.5 11V5.5M12 11V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Progress
        </button>
      </nav>

      <p class="sidebar__footnote">Progress is stored locally in this browser only. No account, no server.</p>
    </aside>

    <div class="app-content">
      <main id="view-root" class="view-root"></main>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
